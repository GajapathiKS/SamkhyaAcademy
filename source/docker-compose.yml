services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: samkhya
      POSTGRES_PASSWORD: samkhya_dev
      POSTGRES_DB: samkhyaacademy
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samkhya -d samkhyaacademy"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: samkhya
      MINIO_ROOT_PASSWORD: samkhya_dev_storage
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  ai-api:
    build: ./services/ai-api
    environment:
      REDIS_URL: redis://redis:6379
      APP_ENV: development
    ports: ["8000:8000"]
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
